services:
  mysql:
    image: mysql:8.0
    container_name: shophub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ShopHub}
      TZ: ${TZ:-UTC}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ShopHub-backend/src/main/resources/db/hmdp.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --skip-name-resolve
    networks:
      - shophub-private
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shophub-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - shophub-private
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./ShopHub-backend
      dockerfile: Dockerfile
    container_name: shophub-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ShopHub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      APP_UPLOAD_DIR: /app/uploads/imgs/
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx512m}
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shophub-private
    restart: unless-stopped

  frontend:
    build:
      context: ./ShopHub-frontend
      dockerfile: Dockerfile
    container_name: shophub-frontend
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:8080"
    depends_on:
      - backend
    networks:
      - shophub-private
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  backend_uploads:

networks:
  shophub-private:
    driver: bridge
